<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Sacramento&display=swap');
:root{--app:#dcd2c4;--nav:#e8ddd0;--card:#f7f2ea;--white:#fff;--sunken:#f2ece2;--head:#ebe1d2;--line:#c9bda9;--subtle:#ded3c2;--ink:#080612;--body:#332c40;--muted:#6d6478;--brand:#a55757;--hover:#8a4747;--soft:#eddede;--rose:#a55757;--rose-soft:#eddede;--sage:#4e715d;--sage-soft:#e1eadf;--blue:#516d92;--blue-soft:#e1e8f0;--gold:#85622f;--gold-soft:#efe5d2;--lilac:#76608f;--lilac-soft:#e9e1ef;font-family:'Noto Sans TC',sans-serif;color:var(--body);background:var(--app);font-synthesis:none}
*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:3px}button{border:1px solid var(--line);background:var(--white);color:var(--body);padding:10px 16px;border-radius:10px;font-size:14px;white-space:nowrap}button:hover{background:var(--sunken)}button.primary{background:var(--brand);color:white;border-color:var(--brand)}button.primary:hover{background:var(--hover)}button.quiet{padding:4px 0;color:var(--brand);background:transparent;border-color:transparent}button:disabled{opacity:.45;cursor:default}input,textarea,select{color:var(--body);background:white;border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%;font-size:14px}textarea{resize:vertical;line-height:1.75;min-height:110px}input:focus{border-color:var(--brand)}h1,h2,h3,p{margin:0}h1{font-size:26px;color:var(--ink);line-height:1.5}h2{font-size:18px;line-height:1.5}h3{font-size:14px}p{font-size:14px;line-height:1.8}small,.muted{color:var(--muted)}small{font-size:12px;line-height:1.7}.mono{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);line-height:1.5}.stack{display:flex;flex-direction:column;gap:16px}.row{display:flex;gap:12px;align-items:center}.between{display:flex;gap:20px;justify-content:space-between;align-items:center}.wrap{flex-wrap:wrap}.rule{height:1px;background:var(--subtle)}.tag{display:inline-flex;align-items:center;gap:5px;background:var(--sunken);color:var(--muted);padding:5px 10px;border-radius:8px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1.5;border:0}.rose{--c:var(--rose);--s:var(--rose-soft)}.sage{--c:var(--sage);--s:var(--sage-soft)}.blue{--c:var(--blue);--s:var(--blue-soft)}.gold{--c:var(--gold);--s:var(--gold-soft)}.lilac{--c:var(--lilac);--s:var(--lilac-soft)}.tag[class*="rose"],.tag.sage,.tag.blue,.tag.gold,.tag.lilac{color:var(--c);background:var(--s)}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}.note{padding:16px;border-radius:12px;background:var(--sunken);display:flex;flex-direction:column;gap:8px}.preview-bar{padding:12px 24px;display:flex;align-items:center;gap:16px;background:#332c40;color:#f7f2ea;flex-wrap:wrap}.preview-bar strong{font-size:12px;letter-spacing:.04em}.preview-bar button{font-size:12px;border:0;padding:7px 12px;background:#4f475b;color:#f7f2ea;border-radius:7px}.preview-bar button.active{background:#eddede;color:#8a4747}.preview-bar small{color:#d0c4cc}.shell{display:flex;min-height:960px}.sidebar{width:236px;flex:none;background:var(--nav);border-right:1px solid var(--line);padding:28px 20px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:4px;color:#7a4a34}.brand span{font-family:Sacramento,cursive;font-size:44px;line-height:1.5}.brand svg{width:26px;height:30px}.sidebar nav{display:flex;flex-direction:column;gap:8px}.nav-item{border:0;background:transparent;color:var(--muted);text-align:left;padding:12px 16px}.nav-item.active{background:var(--soft);color:var(--hover)}.account{margin-top:auto;border-top:1px solid var(--subtle);padding-top:18px;display:flex;flex-direction:column;gap:6px}.workspace{width:calc(100% - 236px);padding:40px;display:flex;flex-direction:column;gap:24px;max-width:1360px}.page-header{display:flex;justify-content:space-between;align-items:center;gap:24px}.page-header>div{display:flex;flex-direction:column;gap:6px}.stats{display:flex;gap:16px}.stat{width:280px;display:flex;flex-direction:column;gap:6px}.stat b{font-size:26px;color:var(--ink)}.agenda{padding:0;overflow:hidden}.agenda-row{display:grid;grid-template-columns:145px 180px minmax(190px,1fr) 90px auto;gap:20px;align-items:center;padding:24px 20px;border-bottom:1px solid var(--subtle);font-size:14px}.agenda-row:last-child{border:0}.agenda-row.next{background:var(--soft);box-shadow:inset 3px 0 var(--brand)}.searchbox{position:relative;width:min(520px,100%)}.search-dropdown{position:absolute;left:0;right:0;top:58px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;z-index:3;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 24px #332c4020}.student-table{padding:0;overflow:hidden}.table-head,.student-row{display:grid;grid-template-columns:minmax(180px,1.1fr) 80px minmax(140px,.8fr) minmax(155px,.9fr) minmax(170px,1fr) 80px;gap:16px;padding:18px 20px;align-items:center}.table-head{background:var(--head);font-size:12px;color:var(--muted)}.student-row{border-bottom:1px solid var(--subtle);font-size:14px}.student-name{display:flex;gap:10px;align-items:center}.student-name>div{display:flex;flex-direction:column;gap:4px}.table-container{overflow:auto}.profile-columns{display:grid;grid-template-columns:1fr 1.1fr;gap:24px}.swatch{width:32px;height:32px;border:3px solid transparent;border-radius:50%;background:var(--c);padding:0}.swatch.selected{outline:2px solid var(--body);outline-offset:2px}.schedule-backdrop{position:fixed;inset:0;background:#08061235;z-index:5;display:flex;justify-content:flex-end}.sheet{width:460px;max-width:100%;padding:28px;background:var(--card);display:flex;flex-direction:column;gap:20px;height:100%;overflow:auto;box-shadow:-24px 0 60px #08061222}.sheet label{display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}.sheet-actions{margin-top:auto;display:flex;justify-content:space-between;padding-top:10px}.calendar{padding:0;overflow:hidden}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekday{background:var(--head);padding:12px;text-align:center;color:var(--muted);font-size:12px}.calendar-day{min-height:122px;padding:12px;border-top:1px solid var(--subtle);border-right:1px solid var(--subtle);display:flex;flex-direction:column;gap:8px}.calendar-day.outside{opacity:.4}.calendar-day.today{background:var(--soft)}.calendar-day.created{box-shadow:inset 0 0 0 2px var(--brand)}.calendar-event{font-size:12px;padding:6px 8px;border:0;border-radius:8px;color:var(--c);background:var(--s);text-align:left;white-space:normal}.toast{background:var(--sage-soft);color:var(--sage);padding:16px;border-radius:12px;font-size:14px}.record-columns{display:grid;grid-template-columns:minmax(0,740fr) minmax(300px,360fr);gap:24px;align-items:start}.record-section{display:flex;flex-direction:column;gap:12px}.record-section textarea{background:white}.record-section textarea.summary{min-height:260px}.parent-columns{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}.history-item{display:flex;flex-direction:column;align-items:start;gap:8px;padding:16px;border:0;background:transparent;text-align:left;white-space:normal}.history-item.selected{background:var(--soft)}.parent-record{display:flex;flex-direction:column;gap:16px}.mobile-wrap{background:#c9bdae;min-height:1040px;padding:40px;display:flex;justify-content:center}.phone{width:390px;min-height:930px;border:1px solid #b6a58e;border-radius:24px;background:var(--app);overflow:hidden;box-shadow:0 24px 70px #332c4030;padding:20px;display:flex;flex-direction:column;gap:20px}.phone .card{padding:20px}.phone h1{font-size:24px}.phone-nav{display:flex;justify-content:space-between;gap:8px;margin-top:auto;padding-top:12px}.phone-nav button{font-size:12px;padding:10px}.login{min-height:900px;display:grid;place-items:center}.login-card{width:440px;max-width:95%;display:flex;flex-direction:column;gap:20px;padding:32px}.login label{display:flex;flex-direction:column;gap:8px;font-size:13px}.validation{color:#8a3b3b;font-size:12px}.empty{text-align:center;padding:44px;color:var(--muted)}[hidden]{display:none!important}.bottom-note{padding:20px 40px 20px 276px;font-size:12px;color:var(--muted)}.saved-message{color:var(--sage);font-size:12px}
@media(max-width:1050px){.agenda-row{grid-template-columns:120px 130px 1fr}.agenda-row>button{grid-column:3}.record-columns,.profile-columns{grid-template-columns:1fr}.parent-columns{grid-template-columns:260px 1fr}.workspace{padding:28px}.calendar-day{padding:8px}.calendar-event{padding:4px;font-size:11px}}
@media(max-width:780px){.preview-bar{padding:10px}.sidebar{display:none}.workspace{width:100%;padding:20px}.shell{min-height:900px}.page-header h1{font-size:24px}.page-header{align-items:start}.page-header button{padding:10px}.stats{flex-wrap:wrap}.stat{width:calc(50% - 8px);padding:16px}.agenda-row{grid-template-columns:95px 1fr;gap:12px}.agenda-row>span:nth-child(3){grid-column:2}.agenda-row>button{grid-column:2}.agenda-row>.tag{grid-column:1}.parent-columns{grid-template-columns:1fr}.parent-columns>aside{display:none}.record-columns{grid-template-columns:1fr}.calendar-day{min-height:100px;padding:6px}.calendar-event{font-size:10px}.row.wrap{gap:8px}.mobile-wrap{padding:20px 0}.phone{width:min(390px,100%)}.bottom-note{padding:16px 20px}.between{gap:12px}.calendar-grid .mono{font-size:11px}}
</style>
<body>
<header class="preview-bar"><strong>TOVA · UI MOCKUP</strong><div class="row wrap" id="screen-tabs"></div><small>設計預覽 · 範例資料</small></header>
<div id="app"></div>
<footer class="bottom-note">延續 Tova 原網站的米色、豆沙紅、Noto Sans TC 與手寫字標。互動與資料僅用於設計示範。</footer>
<script>
const leaf='<svg xmlns="http://www.w3.org/2000/svg" width="26" height="30" viewBox="0 0 26 30" fill="none"><path fill="#D895AA" d="M23.8 2.2C13.2 2.4 5.1 7.1 3.2 14.3c-1.7 6.6 2.7 11.5 8.5 10.2 7.4-1.7 11.3-10.6 12.1-22.3Z"/><path d="M5.1 23.8c4-5.4 8.3-9.6 14.4-15.1M11.9 16.3l.1 5.1M15.7 12.7l4.3.5" stroke="#7A4A34" stroke-linecap="round" stroke-width="1.35"/></svg>';
const brand=()=>`<div class="brand"><span>Tova</span>${leaf}</div>`;
const screenNames={today:'教師今日',students:'學生與搜尋',student:'學生詳情',calendar:'月曆',record:'課程紀錄',parent:'家長桌面',mobile:'家長手機',login:'帳號登入'};
let screen='today',studentColor='rose',selectedSubjects=[],subjectMenu=false,scheduleOpen=false,created=false,summarySaved=false,shared=false,searchValue='',parentHistory=0;
let rawNote='複習移項與去括號。品安能口頭說明解題步驟，遇到負號時仍需提醒；今天獨立完成 8 題中的 6 題。';
let summaryText='本次學習\n一元一次方程式：移項、去括號與驗算。\n\n學習進展\n能獨立完成基本移項，正確率 75%；開始主動寫出驗算。\n\n需要練習\n負號與括號的轉換仍需提醒，建議每題標記符號。\n\n下次計畫\n練習含括號的方程式，再加入生活情境應用題。';
let feedbackText='品安今天能主動說明解題步驟，獨立完成 8 題中的 6 題。請完成習作第 22 頁第 1–4 題，練習時特別留意負號與括號。';
let publishedSummary='',publishedFeedback='';
let scheduledLesson={date:'2026-10-06',time:'16:00',duration:90,topic:'一元一次方程式應用'};
let subjects=['數學','英文','國文','理化'];const subjectColors=['rose','sage','blue','gold'];
const students=[{name:'陳品安',school:'光華國中',grade:'國二',subjects:['數學'],color:'rose',next:'10/06 16:00',parent:'已連結 · 1 位家長'},{name:'林以晴',school:'育成高中',grade:'高一',subjects:['英文'],color:'sage',next:'10/08 14:00',parent:'已連結 · 1 位家長'},{name:'許書妍',school:'明德國中',grade:'國三',subjects:['國文'],color:'blue',next:'10/09 19:00',parent:'已連結 · 1 位家長'},{name:'王子謙',school:'大同國中',grade:'國三',subjects:['數學','理化'],color:'gold',next:'10/07 18:30',parent:'已連結 · 1 位家長'},{name:'張若希',school:'仁愛國中',grade:'國一',subjects:['數學'],color:'lilac',next:'10/08 17:00',parent:'尚未連結'}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tag=(s,c='')=>`<span class="tag ${c}">${esc(s)}</span>`;
const btn=(s,action,kind='')=>`<button type="button" class="${kind}" ${action?`data-action="${action}"`:''}>${esc(s)}</button>`;
const header=(eye,title,action='')=>`<header class="page-header"><div><p class="mono">${eye}</p><h1>${title}</h1></div>${action}</header>`;
const note=(title,body)=>`<div class="note"><h3>${title}</h3><p>${body}</p></div>`;
function side(active,parent=false){const nav=parent?[['學習紀錄','parent'],['課程安排','parent-calendar']]:[['今日','today'],['學生','students'],['課程','calendar']];return `<aside class="sidebar">${brand()}<small>${parent?'家長專屬空間':'個人教學工作區'}</small><div>${tag(parent?'家長端':'教師端','rose')}</div><nav>${nav.map(([label,target])=>`<button class="nav-item ${active===target?'active':''}" data-screen="${target}">${label}</button>`).join('')}</nav><div class="account"><strong>${parent?'陳媽媽':'范老師'}</strong><small>${parent?'已連結 1 位孩子':'個人教師'}</small>${btn('登出','login','quiet')}</div></aside>`}
const shell=(body,active='today',parent=false)=>`<div class="shell">${side(active,parent)}<main class="workspace">${body}</main></div>`;
function today(){return shell(`${header('2026/10/02 · 星期五','今天也準備好了。',btn('安排課程','schedule','primary'))}<p class="muted">把時間留給教學，讓每一次進步都有紀錄。</p><div class="stats"><article class="card stat"><small>今日課程</small><b>3 堂</b><small>下一堂 16:00 開始</small></article><article class="card stat"><small>在學學生</small><b>8 位</b><small>以學生顏色辨識課程</small></article></div><div class="between"><h2>今日議程</h2>${btn('查看全部課程 →','calendar','quiet')}</div><section class="card agenda"><div class="agenda-row"><span class="mono">14:00–15:30</span><strong class="row"><i class="dot sage"></i>林以晴</strong><span>英文 · 閱讀理解</span>${tag('已完成')}${btn('檢視紀錄','record')}</div><div class="agenda-row next"><span class="mono">16:00–17:30</span><strong class="row"><i class="dot ${studentColor}"></i>陳品安</strong><span>數學 · 一元一次方程式</span>${tag('下一堂','rose')}${btn('完成並撰寫紀錄','record','primary')}</div><div class="agenda-row"><span class="mono">19:00–20:00</span><strong class="row"><i class="dot blue"></i>許書妍</strong><span>國文 · 作文練習</span>${tag('已排定')}${btn('課程詳情','calendar')}</div></section><div class="row wrap"><small class="row"><i class="dot ${studentColor}"></i>陳品安</small><small class="row"><i class="dot sage"></i>林以晴</small><small class="row"><i class="dot blue"></i>許書妍</small></div>${note('還有 1 堂課待整理','林以晴的課程已完成。繼續撰寫紀錄，確認後再分享給家長。')}`)}
function searchControl(){return `<div class="searchbox"><input id="student-search" value="${esc(searchValue)}" placeholder="搜尋學生、學校或科目…" aria-label="搜尋學生、學校或科目" aria-expanded="${subjectMenu}" autocomplete="off">${subjectMenu?`<div class="search-dropdown"><small>選擇既有科目標籤</small><div class="row wrap">${subjects.map((s,i)=>`<button class="tag ${subjectColors[i%4]}" data-subject="${esc(s)}">${selectedSubjects.includes(s)?'✓ ':''}${esc(s)}</button>`).join('')}</div><div class="rule"></div><div class="row"><input id="new-subject" placeholder="新科目名稱" aria-label="新科目名稱">${btn('＋ 建立','create-tag')}</div><small>可多選科目；Enter 套用，Esc 關閉。</small>${btn('套用標籤','close-tags','primary')}</div>`:''}</div>`}
function studentList(){const matches=students.filter(s=>`${s.name}${s.school}${s.subjects.join('')}`.includes(searchValue)&&(!selectedSubjects.length||selectedSubjects.some(t=>s.subjects.includes(t))));return shell(`${header('8 位在學學生','學生',btn('新增學生','new-student','primary'))}<div class="between">${searchControl()}${btn('在學學生 ▾','student-status')}</div><div class="row wrap">${selectedSubjects.map(s=>`<button class="tag rose" data-subject="${esc(s)}">${esc(s)} ×</button>`).join('')}<small>${matches.length} 位符合條件</small>${selectedSubjects.length?btn('清除篩選','clear-tags','quiet'):''}</div><section class="table-container"><div class="card student-table"><div class="table-head"><span>學生</span><span>年級</span><span>科目</span><span>下次課程</span><span>家長帳號</span><span></span></div>${matches.map(s=>`<div class="student-row"><div class="student-name"><i class="dot ${s.name==='陳品安'?studentColor:s.color}"></i><div><strong>${s.name}</strong><small>${s.school}</small></div></div><span>${s.grade}</span><div class="row wrap">${s.subjects.map(t=>tag(t,subjectColors[subjects.indexOf(t)%4])).join('')}</div><span class="mono">${s.name==='陳品安'&&created?`${scheduledLesson.date.slice(5).replace('-','/')} ${scheduledLesson.time}`:s.next}</span><small>${s.parent}</small>${btn('查看','student','quiet')}</div>`).join('')}${!matches.length?'<div class="empty">尚未找到學生。請調整搜尋或科目標籤。</div>':''}</div></section><div class="between"><small>學生顏色會同步用於課程與月曆。</small><small>範例顯示 5 位學生</small></div>`,'students')}
function student(){return shell(`${header('學生 / 陳品安','陳品安',btn('＋ 新增上課日期','schedule','primary'))}<div class="row wrap">${tag('國二')}${tag('數學','rose')}<span class="muted">光華國中 · 在學學生</span></div><div class="profile-columns"><section class="card stack"><h2>學生設定</h2><div class="between"><h3>學生顏色</h3><div class="row">${['rose','sage','blue','gold','lilac'].map(c=>`<button class="swatch ${c} ${studentColor===c?'selected':''}" data-color="${c}" aria-label="選擇${c}顏色" aria-pressed="${studentColor===c}"></button>`).join('')}</div></div><small>目前：${{rose:'豆沙紅',sage:'鼠尾草綠',blue:'霧藍',gold:'麥金',lilac:'丁香紫'}[studentColor]} · 套用至所有課程與月曆</small><div class="rule"></div><small>科目</small><div class="row">${tag('數學 ×','rose')}${btn('＋ 新增標籤','edit-subject','quiet')}</div><div class="rule"></div><h3>家長帳號</h3><p>陳媽媽 · 已連結</p><small>家長使用自己的帳號，查看已分享的課程紀錄。</small>${btn('預覽家長畫面','parent','quiet')}</section><section class="card stack"><h2>課程與紀錄</h2><div class="between"><p class="mono">10/02（五）16:00–17:30</p>${tag('紀錄草稿','rose')}</div><p>一元一次方程式 · 課程已完成</p>${btn('撰寫紀錄 →','record','quiet')}<div class="rule"></div><p class="mono">09/29（二）16:00–17:30</p><p>正負數運算 · 家長可見</p>${btn('查看完整紀錄 →','parent','quiet')}${created?`<div class="rule"></div><div class="row"><i class="dot ${studentColor}"></i><p>${scheduledLesson.date} ${scheduledLesson.time}</p></div><p>${esc(scheduledLesson.topic)}</p>${tag('已排定','sage')}`:''}</section></div>${note('從學生直接安排課程','新增上課日期後，同一堂課會自動顯示在課程議程與月曆。')}`,'students')}
function calendar(parent=false){const events={2:[['16:00 陳品安',studentColor],['19:00 許書妍','blue']],6:[['16:00 陳品安',studentColor]],7:[['18:30 王子謙','gold']],8:[['14:00 林以晴','sage']],9:[['19:00 許書妍','blue']],13:[['16:00 陳品安',studentColor]],15:[['14:00 林以晴','sage']],16:[['19:00 許書妍','blue']],20:[['16:00 陳品安',studentColor]],22:[['14:00 林以晴','sage']],23:[['19:00 許書妍','blue']],27:[['16:00 陳品安',studentColor]],29:[['14:00 林以晴','sage']]};if(created){delete events[6]}if(created&&scheduledLesson.date.startsWith('2026-10')){const d=Number(scheduledLesson.date.slice(-2));(events[d]??=[]).push([`${scheduledLesson.time} 陳品安`,studentColor])}return shell(`${header(parent?'陳品安 · 課程安排':'LESSON PLANNING','課程',parent?'':btn('安排課程','schedule','primary'))}<div class="between"><div class="row"><h2>2026 年 10 月</h2>${tag('當月')}</div><div class="row">${btn('議程','agenda')}${btn('月曆','calendar','primary')}</div></div><div class="row wrap">${(parent?[['陳品安',studentColor]]:[['陳品安',studentColor],['林以晴','sage'],['許書妍','blue'],['王子謙','gold']]).map(([n,c])=>`<small class="row"><i class="dot ${c}"></i>${n}</small>`).join('')}</div><section class="card calendar"><div class="calendar-grid">${['一','二','三','四','五','六','日'].map(d=>`<div class="weekday">${d}</div>`).join('')}${Array.from({length:35},(_,i)=>{const date=i-2,outside=date<1||date>31,evs=(events[date]||[]).filter(([n])=>!parent||n.includes('陳品安'));return `<div class="calendar-day ${outside?'outside':''} ${date===2?'today':''} ${created&&date===Number(scheduledLesson.date.slice(-2))?'created':''}"><span class="mono">${outside?(date<1?30+date:date-31):date}</span>${evs.map(([label,color])=>`<button class="calendar-event ${color}" data-action="${parent?'parent':'record'}">${label}</button>`).join('')}</div>`}).join('')}</div></section>${created?`<div class="toast" role="status">✓ 已新增陳品安的課程：${scheduledLesson.date} ${scheduledLesson.time} · 已同步至月曆</div>`:'<small>從學生新增課程後，月曆將顯示相同的日期與學生顏色。</small>'}`,parent?'parent-calendar':'calendar',parent)}
function record(){return shell(`${header('課程 / 陳品安 / 2026/10/02','課程紀錄',btn('返回課程','calendar'))}<div class="row wrap">${tag('陳品安',studentColor)}${tag('數學')}${tag('已完成')}<span class="mono">16:00–17:30</span></div><div class="record-columns"><div class="stack"><section class="card record-section"><div class="between"><h2>01 原始筆記</h2>${tag('✓ 已自動儲存')}</div><small>僅教師可見</small><label for="raw-note">課堂觀察</label><textarea id="raw-note">${esc(rawNote)}</textarea><small id="raw-save-status" class="saved-message">最後儲存 17:42</small></section><section class="card record-section"><div class="between"><h2>02 課堂摘要</h2>${tag(summarySaved?'已儲存':'AI 草稿待確認',summarySaved?'sage':'rose')}</div><small>由原始筆記整理；確認並儲存後才會成為正式紀錄。</small><textarea id="summary" class="summary" aria-label="課堂摘要">${esc(summaryText)}</textarea><div class="between"><small>草稿可以自由編輯。</small>${btn('儲存摘要','save-summary','primary')}</div></section><section class="card record-section"><h2>03 家長可見紀錄</h2><small>整理家長能了解的進展與課後練習，預覽後再分享。</small><textarea id="feedback" aria-label="家長可見紀錄">${esc(feedbackText)}</textarea></section></div><aside class="stack"><section class="card stack"><h2>分享給家長</h2><div>${tag(shared?'家長可見':'尚未分享',shared?'sage':'rose')}</div><p>陳媽媽 · 帳號已連結</p><div class="rule"></div><h3>家長將看到</h3><p>✓ 上課日期與科目<br>✓ 已確認的學習摘要<br>✓ 課後練習與教師回饋</p>${note('教師私人筆記','原始筆記與未確認的 AI 草稿只顯示在教師端。')}${btn('預覽家長畫面','preview-parent')}${btn('確認並分享','share','primary')}<small>${summarySaved?'摘要已儲存，可以確認分享內容。':'請先儲存摘要，再確認分享內容。'}</small></section><section class="card stack"><h2>前次紀錄</h2><p class="mono">2026/09/29 · 數學</p><p>正負數運算與計算步驟</p><div>${tag('家長可見','sage')}</div>${btn('檢視紀錄 →','parent','quiet')}</section></aside></div>`,'calendar')}
const history=[['09/29（二）','正負數運算'],['09/25（五）','分數與小數'],['09/22（二）','計算順序練習']];
function parentRecord(){const item=shared&&parentHistory===-1?['10/02（五）','一元一次方程式']:history[parentHistory>=0?parentHistory:0];return `<div class="between"><h1>${item[1]}</h1>${tag('教師已分享','sage')}</div><p class="mono">2026/${item[0]} 16:00–17:30 · 范老師</p>${shared&&parentHistory===-1?`<h2>課堂摘要</h2><p style="white-space:pre-wrap">${esc(publishedSummary)}</p><h2>老師回饋與課後練習</h2><p>${esc(publishedFeedback)}</p>`:parentHistory===1?'<h2>本次學習</h2><p>複習分數、小數互換與四則運算。</p><h2>孩子的進步</h2><p>能正確換算常見分數與小數，計算步驟比上次更完整。</p><h2>課後練習</h2><p>完成習作第 15 頁第 1–5 題。</p><h2>老師想說</h2><p>這週持續練習，品安已能自己檢查計算過程。</p>':parentHistory===2?'<h2>本次學習</h2><p>認識四則運算的先後順序，練習含括號的算式。</p><h2>孩子的進步</h2><p>能說明先乘除、後加減的規則，並主動標記括號。</p><h2>課後練習</h2><p>完成課堂講義的計算順序練習題。</p><h2>老師想說</h2><p>保留中間步驟，能更快找到需要修正的地方。</p>':'<h2>本次學習</h2><p>練習正負數加減，透過數線理解符號與方向。</p><h2>孩子的進步</h2><p>品安能自行說明解題步驟，基本計算正確率提升；對不確定的題目會主動提問。</p><h2>課後練習</h2><p>請完成習作第 18 頁第 1–6 題，每題保留計算步驟。</p><h2>老師想說</h2><p>今天的學習態度很積極。請鼓勵品安慢慢檢查符號，速度可以在熟悉後再提升。</p>'}<div class="rule"></div><small>分享時間 2026/${item[0].slice(0,5)} 18:10</small>`}
function parent(){return shell(`${header('陳媽媽 · 家長帳號','每一次進步，都看得見。')}<div class="between"><div class="row"><i class="dot ${studentColor}"></i><h2>陳品安 · 國二</h2>${tag('數學','rose')}</div><small>已連結的孩子</small></div><section class="card stack"><div class="between"><div class="stack" style="gap:6px"><small>下一堂課</small><h2>${created?`${scheduledLesson.date.slice(5).replace('-','/')} ${scheduledLesson.time}`:'10/06（二）16:00–17:30'}</h2><p>數學 · ${esc(scheduledLesson.topic)}</p></div>${btn('查看課程安排 →','parent-calendar','quiet')}</div><small>授課教師：范老師</small></section><div class="parent-columns"><aside class="card stack"><h2>歷次課程紀錄</h2><small>依日期由新到舊</small>${shared?`<button class="history-item ${parentHistory===-1?'selected':''}" data-history="-1"><span class="mono">10/02（五）</span><strong>一元一次方程式</strong>${tag('數學',studentColor)}<small>范老師 · 已分享</small></button>`:''}${history.map(([date,title],i)=>`<button class="history-item ${parentHistory===i?'selected':''}" data-history="${i}"><span class="mono">${date}</span><strong>${title}</strong>${tag('數學','rose')}<small>范老師 · 已分享</small></button>`).join('')}<small>共 ${shared?13:12} 堂已分享紀錄</small></aside><article class="card parent-record">${parentRecord()}</article></div><small>此帳號僅顯示已連結孩子的課程與教師已分享的紀錄。</small>`,'parent',true)}
function mobile(){return `<div class="mobile-wrap"><main class="phone"><div class="between">${brand()}${tag('家長端','rose')}</div><div class="stack" style="gap:6px"><h1>陳品安的學習紀錄</h1><small>陳媽媽 · 已連結 1 位孩子</small></div><section class="card stack" style="gap:8px"><small>下一堂課</small><h3>${created?`${scheduledLesson.date.slice(5).replace('-','/')} ${scheduledLesson.time}`:'10/06（二）16:00–17:30'}</h3><div class="row">${tag('數學',studentColor)}<small>${esc(scheduledLesson.topic)}</small></div></section><article class="card stack" style="gap:12px"><div class="between"><h2>最新課程紀錄</h2>${tag('已分享','sage')}</div><h3>${shared?'10/02 · 一元一次方程式':'09/29 · 正負數運算'}</h3><p class="mono">范老師 · 16:00–17:30</p><div class="rule"></div><h3>孩子的進步</h3><p>${shared?esc(publishedFeedback):'能自行說明解題步驟，基本計算正確率提升；遇到不確定的題目會主動提問。'}</p><h3>課後練習</h3><p>${shared?'習作第 22 頁第 1–4 題，留意負號與括號。':'習作第 18 頁第 1–6 題，每題保留計算步驟。'}</p>${btn('查看完整紀錄 →','parent','quiet')}</article><small>只顯示教師已分享的正式紀錄。</small><nav class="phone-nav">${btn('學習紀錄','mobile','primary')}${btn('課程安排','parent-calendar')}${btn('帳號','login','quiet')}</nav></main></div>`}
function login(){return `<main class="login"><section class="card login-card">${brand()}<h1>今天也準備好了。</h1><p class="muted">登入你的教學或家長專屬空間。</p><div class="row">${btn('教師端','login-teacher','primary')}${btn('家長端','login-parent')}</div><label>電子信箱<input type="email" value="parent@example.com" autocomplete="off"></label><label>密碼<input type="password" value="mockup-demo" autocomplete="off"></label><small>家長帳號由教師邀請連結孩子；此處為帳號畫面的設計示範。</small>${btn('登入家長空間','parent','primary')}</section></main>`}
function schedule(){return `<div class="schedule-backdrop"><form class="sheet" id="schedule-form"><div class="between"><h2>新增上課日期</h2>${btn('×','close-sheet','quiet')}</div><p class="muted">從陳品安的學生資料安排課程。</p><div class="row"><i class="dot ${studentColor}"></i><strong>陳品安 · 國二</strong>${tag('數學','rose')}</div><label>上課日期<input type="date" name="date" value="${scheduledLesson.date}" required></label><label>開始時間<input type="time" name="time" value="${scheduledLesson.time}" required></label><label>課程長度<select name="duration"><option value="60">60 分鐘</option><option value="90" selected>90 分鐘</option><option value="120">120 分鐘</option></select></label><label>課程主題（選填）<input name="topic" value="${esc(scheduledLesson.topic)}"></label><div>${tag('預設：已排定')}</div><details><summary>更多詳細資料</summary><label>地點（選填）<input name="location" placeholder="線上 / 到府"></label><label>備註（選填）<textarea name="remark"></textarea></label></details>${note('同步顯示在月曆','儲存後，月曆會出現相同學生顏色的陳品安課程。')}<div class="sheet-actions">${btn('取消','close-sheet')}<button type="submit" class="primary">儲存課程</button></div></form></div>`}
function render(){document.getElementById('screen-tabs').innerHTML=Object.entries(screenNames).map(([id,name])=>`<button class="${screen===id?'active':''}" data-screen="${id}">${name}</button>`).join('');const pages={today,students:studentList,student,calendar,record,parent,mobile,login,'parent-calendar':()=>calendar(true)};document.getElementById('app').innerHTML=(pages[screen]||today)()+(scheduleOpen?schedule():'');document.querySelector('#schedule-form')?.addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.currentTarget);scheduledLesson={date:data.get('date'),time:data.get('time'),duration:Number(data.get('duration')),topic:data.get('topic')||'數學課程'};created=true;scheduleOpen=false;screen='calendar';render()});document.querySelector('#student-search')?.addEventListener('focus',()=>{if(!subjectMenu){subjectMenu=true;render();const input=document.querySelector('#student-search');input.focus();input.setSelectionRange(input.value.length,input.value.length)}});document.querySelector('#student-search')?.addEventListener('input',e=>{searchValue=e.target.value;render();const input=document.querySelector('#student-search');input.focus();input.setSelectionRange(input.value.length,input.value.length)});document.querySelector('#raw-note')?.addEventListener('input',e=>{rawNote=e.target.value;document.querySelector('#raw-save-status').textContent='✓ 已自動儲存（本機示範）'});document.querySelector('#summary')?.addEventListener('input',e=>{summaryText=e.target.value;summarySaved=false});document.querySelector('#feedback')?.addEventListener('input',e=>feedbackText=e.target.value);}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.screen){screen=el.dataset.screen;subjectMenu=screen==='students';render();return}if(el.dataset.subject){const s=el.dataset.subject;selectedSubjects=selectedSubjects.includes(s)?selectedSubjects.filter(t=>t!==s):[...selectedSubjects,s];render();return}if(el.dataset.color){studentColor=el.dataset.color;render();return}if(el.dataset.history){parentHistory=Number(el.dataset.history);render();return}const action=el.dataset.action;if(!action)return;if(action==='schedule'){scheduleOpen=true}else if(action==='close-sheet'){scheduleOpen=false}else if(action==='clear-tags'){selectedSubjects=[];searchValue='';subjectMenu=false}else if(action==='close-tags'){subjectMenu=false}else if(action==='create-tag'){const s=document.querySelector('#new-subject').value.trim();if(s&&!subjects.includes(s))subjects.push(s)}else if(action==='edit-subject'){screen='students';subjectMenu=true}else if(action==='save-summary'){summarySaved=true}else if(action==='share'){if(!summarySaved){el.parentElement.querySelector('small:last-child').innerHTML='<span class="validation">請先儲存摘要，再確認分享內容。</span>';return}publishedSummary=summaryText;publishedFeedback=feedbackText;shared=true;parentHistory=-1;screen='parent'}else if(action==='preview-parent'){parentHistory=0;screen='parent'}else if(action==='agenda'){screen='today'}else if(action==='new-student'){const name=prompt('新學生姓名（設計示範）');if(name?.trim())students.push({name:name.trim(),school:'未設定學校',grade:'—',subjects:[],color:'lilac',next:'尚未安排',parent:'尚未連結'})}else if(action==='student-status'){return}else if(action==='login-teacher'){screen='today'}else if(action==='login-parent'){screen='parent'}else if(['today','student','students','calendar','record','parent','mobile','login','parent-calendar'].includes(action)){screen=action}else{return}render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){subjectMenu=false;scheduleOpen=false;render()}if(e.key==='Enter'&&e.target.id==='student-search'){subjectMenu=false;render()}});
const query=new URLSearchParams(location.search);if(query.get('screen'))screen=query.get('screen');if(query.get('sample')==='calendar')created=true;render();
</script>
</body>
